# config/watchlist.yaml - companies whose job boards are checked every run.
#
# source: greenhouse | lever | ashby | smartrecruiters | workday | eightfold
# slug:   the board's id. Find it in the company's careers URL, e.g.
#         job-boards.greenhouse.io/<slug>, jobs.lever.co/<slug>, jobs.ashbyhq.com/<slug>,
#         jobs.smartrecruiters.com/<slug>
# Workday needs host + site (from <host>/<site> in the careers URL).
# Eightfold needs host, and slug is the company domain.
# Run `python -m jobalert check` after editing to confirm every board responds.

companies:
  # --- Orange County -------------------------------------------------------
  - {key: anduril, name: Anduril, source: greenhouse, slug: andurilindustries}
  - {key: twitch, name: Twitch, source: greenhouse, slug: twitch}
  # Not verified yet; enable and run `check`:
  - {key: edwards, name: Edwards Lifesciences, source: workday, slug: edwards,
     host: edwards.wd5.myworkdayjobs.com, site: EdwardsCareers, search_text: intern, enabled: false}
  - {key: skyworks, name: Skyworks, source: workday, slug: skyworks,
     host: skyworks.wd1.myworkdayjobs.com, site: SkyworksCareers, search_text: intern, enabled: false}

  # --- Companies with personal connections ---------------------------------
  - {key: paypal, name: PayPal, source: eightfold, slug: paypal.com, host: paypal.eightfold.ai, search_text: intern}
  - {key: linkedin, name: LinkedIn, source: smartrecruiters, slug: LinkedIn3}
  - {key: broadcom, name: Broadcom, source: workday, slug: broadcom,
     host: broadcom.wd1.myworkdayjobs.com, site: External_Career, search_text: intern}

