name: live-check

# End-to-end smoke test against the real job boards and a real local model.
# Run it from the Actions tab ("Run workflow"). It also runs when this file changes.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max postings the agent assesses"
        default: "2"
  push:
    paths: [".github/workflows/live-check.yml"]

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Install Ollama and pull the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
          ollama pull qwen2.5:7b

      - name: Check every job board and the model
        run: python -m jobalert check | tee check.txt
        continue-on-error: true

      - name: Dry run with the agent
        run: |
          # CPU-only runner: allow slow model calls
          sed -i 's/^  timeout: 180/  timeout: 900/' config/settings.yaml
          python -m jobalert run --dry-run --limit "${{ github.event.inputs.limit || '2' }}" 2>&1 | tee run.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Job boards"; echo '```'; cat check.txt 2>/dev/null; echo '```'
            echo "## Run"; echo '```'; tail -n 40 run.txt 2>/dev/null; echo '```'
            echo "## Assessed postings"; echo '```'; python -m jobalert list 2>/dev/null; echo '```'
            echo "## Assessment details"; echo '```'
            python - <<'PY' 2>/dev/null
          import json, sqlite3
          db = sqlite3.connect("data/jobs.db"); db.row_factory = sqlite3.Row
          for r in db.execute("SELECT p.title, a.* FROM assessments a JOIN postings p USING(uid)"):
              print(f"{r['title']}  fit={r['fit_score']} conf={r['confidence']} ai={r['ai_forward']} resume={r['recommended_resume']}")
              for k in ("reasons", "gaps", "evidence", "review_reasons", "tool_calls"):
                  print(f"  {k}: {json.loads(r[k] or '[]')}")
          PY
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest
          path: |
            out/digest.html
            check.txt
            run.txt
